[package]
name = "jellycat"
version = "0.1.0"
edition = "2024"
description = "A CLI tool that bridges Jujutsu (jj) version control with GitHub Pull Requests"
license = "MIT"
repository = "https://github.com/fanzeyi/jellycat"

[[bin]]
name = "jc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4"
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
assert_cmd = "2.1.2"
mockall = "0.14.0"
predicates = "3.1.4"
tempfile = "3.26.0"
